    <div class="mt-8 p-6 bg-white rounded-lg shadow-md">
        <h3 class="text-xl font-semibold mb-4">
          AI-Powered Feedback Question Generator
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Gemini Input Form -->
          <div class="bg-gray-50 p-4 rounded-md">
            <div class="mb-4">
              <label for="feedbackTopic" class="block text-sm font-medium text-gray-700 mb-1">Topic for Feedback
                Questions</label>
              <input type="text" id="feedbackTopic"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="e.g., Customer Satisfaction with New Product" />
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label for="audience" class="block text-sm font-medium text-gray-700 mb-1">Target Audience</label>
                <input type="text" id="audience"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                  placeholder="e.g., Existing Customers" />
              </div>

              <div>
                <label for="numQuestions" class="block text-sm font-medium text-gray-700 mb-1">Number of
                  Questions</label>
                <select id="numQuestions"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                  <option value="3">3 Questions</option>
                  <option value="5" selected>5 Questions</option>
                  <option value="7">7 Questions</option>
                  <option value="10">10 Questions</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label for="questionType" class="block text-sm font-medium text-gray-700 mb-1">Question Type</label>
                <select id="questionType"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                  <option value="open-ended">Open-Ended</option>
                  <option value="multiple-choice">Multiple Choice</option>
                  <option value="likert-scale">Likert Scale</option>
                  <option value="mixed">Mixed Format</option>
                </select>
              </div>

              <div>
                <label for="questionDepth" class="block text-sm font-medium text-gray-700 mb-1">Question Depth</label>
                <select id="questionDepth"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                  <option value="basic">Basic</option>
                  <option value="moderate" selected>Moderate</option>
                  <option value="in-depth">In-Depth</option>
                </select>
              </div>
            </div>

            <div id="mcqOptionsContainer" class="mb-4 hidden">
              <label for="mcqOptions" class="block text-sm font-medium text-gray-700 mb-1">Multiple Choice
                Options</label>
              <select id="mcqOptions"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                <option value="3">3 Options</option>
                <option value="4" selected>4 Options</option>
                <option value="5">5 Options</option>
              </select>
            </div>

            <div class="mb-4">
              <label for="goal" class="block text-sm font-medium text-gray-700 mb-1">Feedback Goal</label>
              <textarea id="goal" rows="2"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="e.g., Identify product improvement areas and customer satisfaction levels"></textarea>
            </div>

            <div class="mb-4">
              <label for="model" class="block text-sm font-medium text-gray-700 mb-1">AI Model</label>
              <select id="model"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                <option value="gemini-1.5-pro" selected>Gemini 1.5 Pro</option>
                <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
              </select>
            </div>

            <button id="generateQuestions"
              class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
              Generate Feedback Questions
            </button>
          </div>

          <!-- Generated Questions Display -->
          <div class="bg-gray-50 p-4 rounded-md">
            <div id="loadingIndicator" class="hidden">
              <div class="flex items-center justify-center h-40">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
              </div>
              <p class="text-center text-gray-600">
                Generating high-quality feedback questions...
              </p>
            </div>

            <div id="errorContainer" class="hidden">
              <div class="bg-red-50 border-l-4 border-red-400 p-4">
                <div class="flex">
                  <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                      fill="currentColor">
                      <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                        clip-rule="evenodd" />
                    </svg>
                  </div>
                  <div class="ml-3">
                    <p class="text-sm text-red-700" id="errorMessage">
                      An error occurred while generating questions.
                    </p>
                  </div>
                </div>
              </div>
            </div>

            <div id="resultsContainer" class="hidden">
              <h4 class="font-medium text-lg mb-2">Generated Questions</h4>
              <div id="questionsContainer" class="space-y-4">
                <!-- Questions will be inserted here -->
              </div>

              <div class="mt-6 flex justify-between">
                <button id="useAllQuestions"
                  class="bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                  Use All Questions
                </button>
                <button id="generateMoreQuestions"
                  class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                  Generate More
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>